<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PSVP — Story de Aviso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@500;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template-styles.css">
</head>
<body>
  <main class="frame story" style="background: linear-gradient(180deg, var(--cream), #fff);">
    <div style="height:190px; background:var(--burgundy); padding:36px 30px; color:var(--white);">
      <p class="eyebrow">Aviso importante</p>
      <h1 class="title" style="font-size:48px;">Novo<br>horário</h1>
    </div>
    <section style="padding:40px 32px;">
      <p style="margin:0; color:var(--burgundy); font-size:20px; font-weight:800; line-height:1.25;">A missa vespertina passa para 18h30 a partir de abril.</p>
      <div class="divider"></div>
      <p style="margin:0; color:rgba(46,30,28,.68); font-size:15px; line-height:1.55;">Confira sempre a programação atualizada nos canais oficiais da paróquia.</p>
    </section>
    <div class="brand" style="color:var(--burgundy);">
      <span>@saovicentealdeota</span>
      <span class="monogram">SVP</span>
    </div>
  </main>
</body>
</html>
