<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PSVP — Carrossel de Formação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@500;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template-styles.css">
</head>
<body>
  <main class="frame carousel" style="background:var(--cream);">
    <div style="position:absolute; inset:0; border:18px solid var(--burgundy); opacity:.96;"></div>
    <section style="position:relative; z-index:1; padding:58px 44px; text-align:center;">
      <p class="eyebrow">Formação</p>
      <h1 class="title" style="font-size:46px; color:var(--burgundy);">O que é<br><span style="color:var(--gold);">o dízimo?</span></h1>
      <p class="subtitle" style="font-size:23px; color:rgba(46,30,28,.72);">Um gesto de fé, gratidão e responsabilidade com a missão da Igreja.</p>
      <div style="width:88px; height:88px; border:1px solid var(--gold); border-radius:50%; display:grid; place-items:center; margin:44px auto 0; color:var(--gold); font-family:var(--heading); font-size:28px;">1/5</div>
    </section>
    <div class="brand" style="color:var(--burgundy);">
      <span>@saovicentealdeota</span>
      <span class="monogram">SVP</span>
    </div>
  </main>
</body>
</html>
