<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PSVP — Post de Evento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@500;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template-styles.css">
</head>
<body>
  <main class="frame post" style="background: var(--burgundy); color: var(--white);">
    <div class="photo" style="position:absolute; inset:0; opacity:.2;"></div>
    <section style="position:relative; z-index:1; padding:48px 44px;">
      <p class="eyebrow">Evento paroquial</p>
      <h1 class="title" style="font-size:58px;">Retiro de<br><span style="color:var(--gold)">Quaresma</span></h1>
      <div class="divider"></div>
      <p class="subtitle" style="max-width:340px; color:rgba(255,255,255,.72); font-size:24px;">Um dia de oração, escuta e preparação para a Páscoa.</p>
      <div style="display:flex; gap:18px; align-items:center; margin-top:36px;">
        <div class="date-pill"><strong>15</strong><span>Abr</span></div>
        <div style="font-size:17px; line-height:1.5; color:rgba(255,255,255,.82);">
          <strong>8h às 17h</strong><br>
          Salão Paroquial
        </div>
      </div>
    </section>
    <div class="brand">
      <span>Paróquia São Vicente de Paulo</span>
      <span class="monogram">SVP</span>
    </div>
  </main>
</body>
</html>
