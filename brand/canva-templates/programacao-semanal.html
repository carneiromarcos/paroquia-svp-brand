<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PSVP — Programação Semanal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template-styles.css">
</head>
<body>
  <main class="frame story" style="background:var(--cream);">
    <section style="padding:38px 32px;">
      <p class="eyebrow">Agenda da semana</p>
      <h1 class="title" style="font-size:42px; color:var(--burgundy);">Programação<br>paroquial</h1>
      <div class="divider"></div>
      <div style="display:grid; gap:12px; margin-top:30px;">
        <div style="padding:14px 16px; background:#fff; border-left:4px solid var(--gold);"><strong>Segunda a Sexta</strong><br><span>Missas: 6h30, 11h30 e 17h</span></div>
        <div style="padding:14px 16px; background:#fff; border-left:4px solid var(--gold);"><strong>Sábado</strong><br><span>Missas: 6h30, 12h e 17h</span></div>
        <div style="padding:14px 16px; background:#fff; border-left:4px solid var(--gold);"><strong>Domingo</strong><br><span>Missas: 6h30, 9h, 11h30, 17h e 19h</span></div>
        <div style="padding:14px 16px; background:#fff; border-left:4px solid var(--green);"><strong>Confissões</strong><br><span>Terça a sábado: 15h às 17h</span></div>
      </div>
    </section>
    <div class="brand" style="color:var(--burgundy);">
      <span>Paróquia São Vicente de Paulo</span>
      <span class="monogram">SVP</span>
    </div>
  </main>
</body>
</html>
