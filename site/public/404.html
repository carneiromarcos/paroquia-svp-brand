<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // SPA redirect for GitHub Pages
    var path = window.location.pathname;
    var repo = '/paroquia-svp-brand';
    if (path.startsWith(repo)) {
      window.location.replace(repo + '/?route=' + encodeURIComponent(path.slice(repo.length)));
    }
  </script>
</head>
<body></body>
</html>
