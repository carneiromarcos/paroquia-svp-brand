<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PSVP — Thumbnail YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template-styles.css">
</head>
<body>
  <main class="frame thumbnail" style="background:var(--burgundy); color:var(--white);">
    <div class="photo" style="position:absolute; inset:0 0 0 44%; opacity:.5;"></div>
    <section style="position:relative; z-index:1; width:54%; height:100%; padding:44px 38px;">
      <p class="eyebrow">Ao vivo</p>
      <h1 class="title" style="font-size:52px;">Santa<br><span style="color:var(--gold);">Missa</span></h1>
      <p style="margin:20px 0 0; color:rgba(255,255,255,.75); font-size:18px; font-weight:700;">Domingo · 9h</p>
    </section>
    <div class="brand" style="color:var(--white);">
      <span>Paróquia São Vicente de Paulo</span>
      <span class="monogram">SVP</span>
    </div>
  </main>
</body>
</html>
