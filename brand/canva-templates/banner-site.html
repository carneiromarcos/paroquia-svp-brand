<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>PSVP — Banner do Site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Inter:wght@700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="template-styles.css">
</head>
<body>
  <main class="frame banner" style="background:var(--burgundy); color:var(--white);">
    <div class="photo" style="position:absolute; inset:0; opacity:.32;"></div>
    <section style="position:relative; z-index:1; width:58%; padding:54px 64px;">
      <p class="eyebrow">Comunidade</p>
      <h1 class="title" style="font-size:58px;">Pastorais e<br><span style="color:var(--gold);">movimentos</span></h1>
      <p class="subtitle" style="font-size:24px; color:rgba(255,255,255,.72);">Participe da vida pastoral e caminhe conosco.</p>
    </section>
    <div class="brand" style="color:var(--white);">
      <span>Paróquia São Vicente de Paulo</span>
      <span class="monogram">SVP</span>
    </div>
  </main>
</body>
</html>
